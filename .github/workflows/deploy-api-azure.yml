name: Deploy API to Azure

# Builds the API image, pushes it to GitHub Container Registry, and (when Azure
# is configured) rolls it out to the Container App.
#
# One-time setup (docs/deploy-azure.md, step 3):
#   Repository variables:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#                          AZURE_RESOURCE_GROUP, AZURE_CONTAINERAPP_NAME
#   Uses OpenID Connect — no Azure passwords are stored in GitHub.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "compliance/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-api-azure
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/securityos-api

jobs:
  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securityos
          POSTGRES_PASSWORD: securityos
          POSTGRES_DB: securityos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securityos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: openssl genrsa -out backend/tests/dev_key.pem 2048
      - name: pytest
        env:
          ENV: test
          AUTH_DEV_PRIVATE_KEY_PATH: backend/tests/dev_key.pem
          AUTH_ISSUER: http://localhost/ci-issuer
          AUTH_AUDIENCE: securityos-ci
          TEST_DATABASE_URL: postgresql://securityos:securityos@localhost:5432/securityos_test
        run: python -m pytest backend/tests -q

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag latest
        run: |
          latest="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]'):latest"
          docker buildx imagetools create -t "$latest" "${{ steps.meta.outputs.image }}"

  deploy:
    name: Roll out to Azure Container Apps
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update container image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"
      - name: Wait for readiness
        run: |
          fqdn=$(az containerapp show -n "${{ vars.AZURE_CONTAINERAPP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://${fqdn}/health/ready"; then echo; echo "Ready: https://${fqdn}"; exit 0; fi
            sleep 10
          done
          echo "API did not become ready" >&2; exit 1
